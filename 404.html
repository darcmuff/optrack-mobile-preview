<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpTrack</title>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '');
      if (!/\/demo$/.test(path)) return;
      var root = path.replace(/\/demo$/, '/');
      fetch(root + 'index.html', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (html) {
          if (!/<base\s/i.test(html)) {
            html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + root + '">');
          }
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.innerHTML = '<p style="font:16px/1.4 system-ui;padding:2rem">This preview needs the /demo route.</p>';
        });
    })();
  </script>
</head>
<body></body>
</html>
